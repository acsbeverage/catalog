<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACS Beverage Co. — Product Catalog</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<style>
  :root{
    --wine:#5b1a2b;
    --wine-dark:#3c0f1c;
    --cream:#f6efe4;
    --parchment:#efe4d1;
    --ink:#2a2119;
    --ink-soft:#6b5f52;
    --gold:#b08d4f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top, #6e2237 0%, var(--wine-dark) 55%, #24070f 100%);
    color:var(--cream);
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }
  header{
    padding:22px 24px 10px;
    text-align:center;
    flex-shrink:0;
  }
  header .eyebrow{
    font-family:Georgia,serif;
    font-style:italic;
    font-size:13px;
    letter-spacing:.04em;
    color:var(--gold);
    margin:0 0 2px;
  }
  header h1{
    margin:0;
    font-size:clamp(22px,4vw,34px);
    font-weight:400;
    letter-spacing:.01em;
  }
  #stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px 16px 6px;
    min-height:0;
  }
  #book{
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .page{
    background:var(--parchment);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .page img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .page.page-cover{
    background:linear-gradient(160deg,var(--wine) 0%,#7a2c40 100%);
  }
  .loading, .error{
    color:var(--cream);
    text-align:center;
    font-size:15px;
    padding:40px;
    max-width:420px;
  }
  .loading .spinner{
    width:34px;height:34px;margin:0 auto 16px;
    border:3px solid rgba(255,255,255,.25);
    border-top-color:var(--gold);
    border-radius:50%;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:14px 16px 26px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .ctrl{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    color:var(--cream);
    border-radius:999px;
    padding:9px 18px;
    font-size:14px;
    cursor:pointer;
    transition:background .15s ease;
    display:flex;align-items:center;gap:6px;
  }
  .ctrl:hover{background:rgba(255,255,255,.16);}
  .ctrl:disabled{opacity:.35;cursor:default;background:rgba(255,255,255,.08);}
  #page-indicator{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13px;
    color:var(--gold);
    min-width:64px;
    text-align:center;
  }
  a.ctrl{text-decoration:none;}
  @media (max-width:600px){
    footer{gap:10px;}
    .ctrl{padding:8px 13px;font-size:13px;}
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">ACS Beverage Co.</p>
  <h1>Product Catalog</h1>
</header>

<div id="stage">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    Loading catalog…
  </div>
</div>

<footer id="controls" style="display:none">
  <button class="ctrl" id="prev-btn">‹ Prev</button>
  <span id="page-indicator">1 / 1</span>
  <button class="ctrl" id="next-btn">Next ›</button>
  <a class="ctrl" id="download-link" href="#" download>Download PDF</a>
</footer>

<script>
/* ============================================================
   CONFIG — the only line you should need to change.
   Point this at your catalog PDF. It can be a relative path
   (same folder as this file) or a full URL.
============================================================ */
const CATALOG_PDF_URL = 'catalog.pdf';

/* ============================================================
   Renders each page of the PDF to a canvas image, then hands
   those images to page-flip for the interactive flip effect.
   No account, no watermark, no page-view limits, no server.
============================================================ */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const stage = document.getElementById('stage');
const loadingEl = document.getElementById('loading');
const controls = document.getElementById('controls');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const pageIndicator = document.getElementById('page-indicator');
const downloadLink = document.getElementById('download-link');

downloadLink.href = CATALOG_PDF_URL;

async function renderPdfToImages(url) {
  const loadingTask = pdfjsLib.getDocument(url);
  const pdf = await loadingTask.promise;
  const images = [];
  const targetWidth = 1000; // render resolution -- sharp on retina, not huge on disk/memory

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = targetWidth / baseViewport.width;
    const viewport = page.getViewport({ scale });

    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');

    await page.render({ canvasContext: ctx, viewport }).promise;
    images.push(canvas.toDataURL('image/jpeg', 0.9));

    loadingEl.textContent = '';
    const spinner = document.createElement('div');
    spinner.className = 'spinner';
    loadingEl.appendChild(spinner);
    loadingEl.appendChild(document.createTextNode(`Loading catalog… (${i}/${pdf.numPages})`));
  }
  return images;
}

async function init() {
  let images;
  try {
    images = await renderPdfToImages(CATALOG_PDF_URL);
  } catch (err) {
    stage.innerHTML = `<div class="error">
      Couldn't load <strong>${CATALOG_PDF_URL}</strong>.<br><br>
      Make sure the PDF file is uploaded next to this HTML file,
      and that CATALOG_PDF_URL at the top of the script matches its filename.
      <br><br><span style="opacity:.6;font-size:13px">${(err && err.message) || err}</span>
    </div>`;
    return;
  }

  loadingEl.remove();

  const bookEl = document.createElement('div');
  bookEl.id = 'book';
  stage.appendChild(bookEl);

  // Responsive sizing: fit the viewport while keeping a sensible page aspect ratio.
  const firstImg = new Image();
  firstImg.src = images[0];
  await new Promise(r => { firstImg.onload = r; });
  const aspect = firstImg.naturalWidth / firstImg.naturalHeight;

  function computeSize() {
    const maxW = Math.min(window.innerWidth - 32, 1100);
    const maxH = window.innerHeight - 170;
    const isPortraitMode = maxW < 700; // single-page mode on narrow screens
    let pageW = isPortraitMode ? maxW : maxW / 2;
    let pageH = pageW / aspect;
    if (pageH > maxH) {
      pageH = maxH;
      pageW = pageH * aspect;
    }
    return { width: Math.floor(pageW), height: Math.floor(pageH) };
  }

  const size = computeSize();

  const pageFlip = new St.PageFlip(bookEl, {
    width: size.width,
    height: size.height,
    size: 'fixed',
    minWidth: 200,
    maxWidth: 1200,
    minHeight: 260,
    maxHeight: 1600,
    showCover: true,
    usePortrait: true,
    maxShadowOpacity: 0.5,
    mobileScrollSupport: true,
  });

  pageFlip.loadFromImages(images);

  controls.style.display = 'flex';
  const totalPages = images.length;

  function updateIndicator() {
    const current = pageFlip.getCurrentPageIndex() + 1;
    pageIndicator.textContent = `${current} / ${totalPages}`;
    prevBtn.disabled = current <= 1;
    nextBtn.disabled = current >= totalPages;
  }
  updateIndicator();

  pageFlip.on('flip', updateIndicator);
  prevBtn.addEventListener('click', () => pageFlip.flipPrev());
  nextBtn.addEventListener('click', () => pageFlip.flipNext());
}

init();
</script>
</body>
</html>
